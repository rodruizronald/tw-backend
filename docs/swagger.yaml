basePath: /api/v1
definitions:
  company.Company:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      jobs:
        description: Relationships (not stored in database)
        items:
          $ref: '#/definitions/jobs.Job'
        type: array
      name:
        type: string
      updated_at:
        type: string
    type: object
  company.CreateCompanyRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  company.UpdateCompanyRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
    required:
    - is_active
    - name
    type: object
  httpservice.ErrorDetails:
    properties:
      code:
        type: string
      details:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  httpservice.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpservice.ErrorDetails'
    type: object
  httpservice.HealthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: healthy
        type: string
      timestamp:
        example: "2024-01-15T10:30:45Z"
        type: string
    type: object
  jobs.ErrorDetails:
    properties:
      code:
        type: string
      details:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  jobs.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/jobs.ErrorDetails'
    type: object
  jobs.Job:
    properties:
      applicationURL:
        type: string
      benefits:
        items:
          type: string
        type: array
      companyID:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      employmentType:
        type: string
      experienceLevel:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      location:
        type: string
      mainTechnologies:
        items:
          type: string
        type: array
      responsibilities:
        items:
          type: string
        type: array
      signature:
        type: string
      skillMustHave:
        items:
          type: string
        type: array
      skillNiceHave:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
      workMode:
        type: string
    type: object
  jobs.JobRequirementsResponse:
    properties:
      must_have:
        items:
          type: string
        type: array
      nice_to_have:
        items:
          type: string
        type: array
    type: object
  jobs.JobResponse:
    properties:
      application_url:
        type: string
      benefits:
        items:
          type: string
        type: array
      company_id:
        type: integer
      company_logo_url:
        type: string
      company_name:
        type: string
      description:
        type: string
      employment_type:
        type: string
      experience_level:
        type: string
      job_id:
        type: integer
      location:
        type: string
      main_technologies:
        items:
          type: string
        type: array
      posted_at:
        type: string
      requirements:
        $ref: '#/definitions/jobs.JobRequirementsResponse'
      responsibilities:
        items:
          type: string
        type: array
      technologies:
        items:
          $ref: '#/definitions/jobs.TechnologyResponse'
        type: array
      title:
        type: string
      work_mode:
        type: string
    type: object
  jobs.PaginationDetails:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  jobs.SearchResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/jobs.JobResponse'
        type: array
      pagination:
        $ref: '#/definitions/jobs.PaginationDetails'
    type: object
  jobs.TechnologyResponse:
    properties:
      category:
        type: string
      name:
        type: string
      required:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: A job board API for managing job postings
  title: Job Board API
  version: "1.0"
paths:
  /companies:
    get:
      consumes:
      - application/json
      description: Retrieve all companies from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/company.Company'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
      summary: List all companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: Create a new company with the provided name and active status
      parameters:
      - description: Company creation request
        in: body
        name: company
        required: true
        schema:
          $ref: '#/definitions/company.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/company.Company'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
      summary: Create a new company
      tags:
      - companies
  /companies/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a company by its ID
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
      summary: Delete a company
      tags:
      - companies
    put:
      consumes:
      - application/json
      description: Update an existing company's name and active status
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: integer
      - description: Company update request
        in: body
        name: company
        required: true
        schema:
          $ref: '#/definitions/company.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/company.Company'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpservice.ErrorResponse'
      summary: Update a company
      tags:
      - companies
  /health:
    get:
      description: Returns the health status of the service and its dependencies
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/httpservice.HealthResponse'
        "503":
          description: Service is unhealthy
          schema:
            $ref: '#/definitions/httpservice.HealthResponse'
      summary: Health check endpoint
      tags:
      - health
  /jobs:
    get:
      consumes:
      - application/json
      description: Search for jobs with optional filters and pagination
      parameters:
      - description: Search query
        example: '"golang developer"'
        in: query
        name: q
        required: true
        type: string
      - default: 20
        description: Number of results to return (max 100)
        example: 20
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of results to skip
        example: 0
        in: query
        name: offset
        type: integer
      - description: Experience level filter
        in: query
        name: experience
        type: string
      - description: Employment type filter
        in: query
        name: type
        type: string
      - description: Location filter
        enum:
        - costarica
        - latam
        example: '"costarica"'
        in: query
        name: location
        type: string
      - description: Work mode filter
        enum:
        - remote
        - hybrid
        - onsite
        example: '"remote"'
        in: query
        name: mode
        type: string
      - description: Company name filter (partial match)
        example: '"Tech Corp"'
        in: query
        name: company
        type: string
      - description: Start date filter (YYYY-MM-DD)
        example: '"2024-01-01"'
        in: query
        name: date_from
        type: string
      - description: End date filter (YYYY-MM-DD)
        example: '"2024-12-31"'
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobs.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/jobs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jobs.ErrorResponse'
      summary: Search for jobs
      tags:
      - jobs
  /jobs/count:
    get:
      consumes:
      - application/json
      description: Get the total count of jobs that match the search criteria without
        returning the actual job data
      parameters:
      - description: Search query
        example: '"golang developer"'
        in: query
        name: q
        required: true
        type: string
      - description: Experience level filter
        in: query
        name: experience
        type: string
      - description: Employment type filter
        in: query
        name: type
        type: string
      - description: Location filter
        enum:
        - costarica
        - latam
        example: '"costarica"'
        in: query
        name: location
        type: string
      - description: Work mode filter
        enum:
        - remote
        - hybrid
        - onsite
        example: '"remote"'
        in: query
        name: mode
        type: string
      - description: Company name filter (partial match)
        example: '"Tech Corp"'
        in: query
        name: company
        type: string
      - description: Start date filter (YYYY-MM-DD)
        example: '"2024-01-01"'
        in: query
        name: date_from
        type: string
      - description: End date filter (YYYY-MM-DD)
        example: '"2024-12-31"'
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Returns count in format: {"count": 42}'
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/jobs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jobs.ErrorResponse'
      summary: Get count of jobs matching search criteria
      tags:
      - jobs
swagger: "2.0"
